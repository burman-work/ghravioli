name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts tests examples
      - run: python scripts/sync_agent_skills.py --check
      - run: python scripts/audit_repository.py --tree
      - run: git diff --check

  package:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - id: artifacts
        run: python scripts/discover_artifacts.py --dist dist --github-output "$GITHUB_OUTPUT"
      - run: python -m twine check "${{ steps.artifacts.outputs.wheel }}" "${{ steps.artifacts.outputs.sdist }}"
      - run: python scripts/verify_sdist.py "${{ steps.artifacts.outputs.sdist }}"
      - run: python -m pip install --force-reinstall "${{ steps.artifacts.outputs.wheel }}"
      - run: python -m pip check
      - run: ghravioli --help
